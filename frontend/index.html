<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes tâches</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>Mes tâches</h1>
    <p id="result"></p>
    <form id="task-form">
      <input id="title" type="text" placeholder="Nouvelle tâche" aria-label="Nouvelle tâche" maxlength="255" required>
      <button type="submit">Ajouter</button>
    </form>
    <p id="error" role="alert"></p>
    <ul id="tasks" aria-label="Liste des tâches"></ul>
  </main>
  <script src="/script.js" defer></script>
</body>
</html>
