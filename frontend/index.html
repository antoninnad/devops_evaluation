<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes tâches</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>Mes tâches</h1>
    <p id="result"></p>
    <form id="task-form">
      <input id="title" type="text" placeholder="Nouvelle tâche" aria-label="Nouvelle tâche" maxlength="255" required>
      <button type="submit" disabled>Ajouter</button>
    </form>
    <p id="error" role="alert"></p>
    <p id="counter" aria-live="polite"></p>
    <label for="task-filter">Afficher</label>
    <select id="task-filter">
      <option value="all">Toutes les tâches</option>
      <option value="todo">À faire</option>
      <option value="done">Terminées</option>
    </select>
    <ul id="tasks" aria-label="Liste des tâches"></ul>
  </main>
  <script src="/script.js" defer></script>
</body>
</html>
