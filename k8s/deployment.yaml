# deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1                # 3 en prod
  selector:
    matchLabels: { app: app }
  template:
    metadata:
      labels: { app: app }
    spec:
      containers:
        - name: app
          image: kaneki599/devops_evaluation_ziyad_fares_antonin_younes:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80   # adaptez au port réel de l'app
---
apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  selector: { app: app }
  ports:
    - port: 80
      targetPort: 80
