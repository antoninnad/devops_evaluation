name: Validation

on:
  push:
    branches: [Val]

permissions:
  contents: read

concurrency:
  group: deploy-val
  cancel-in-progress: false

jobs:
  lint:
    uses: ./.github/workflows/test-before.yml
  tests:
    uses: ./.github/workflows/test-api.yml

  publish:
    needs: [lint, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publier les trois images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: bash .github/scripts/publish-images.sh
      - uses: actions/upload-artifact@v4
        with:
          name: images-val
          path: images.txt
          if-no-files-found: error
          overwrite: true

  deploy:
    needs: publish
    runs-on: [self-hosted, kubernetes]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: images-val
      - name: Déployer et vérifier Val
        run: bash .github/scripts/deploy-k8s.sh devops-val images.txt
